        Material: [{value:"Satin Photo", multiplier:1.00},{value:"Matte Heavy", multiplier:1.15},{value:"Canvas", multiplier:2.00}],
        Finishing: [{value:"Rolled", multiplier:1.00, setup_addon:0},{value:"Mounted on Foam", multiplier:1.50, setup_addon:10},{value:"Framed", multiplier:2.50, setup_addon:25}],
        Quantity: [{value:"1"},{value:"5"},{value:"10"}]
      }}]},
  "magnets": { name: "Magnets", products: [
    { name: "Custom Magnet", sku_prefix: "MG-CUS",
      description: "Promotional and decorative magnets.",
      pricing: { base_setup_cost: 10.00, base_per_unit_cost: 0.10, margin_pct: 1.00 },
      attributes: {
        Size: [{value:"2 x 3.5 in (Business Card)", multiplier:1.00},{value:"3 x 4 in", multiplier:1.50},{value:"4 x 6 in", multiplier:2.00},{value:"5 x 7 in", multiplier:2.60}],
        Shape: [{value:"Rectangle", multiplier:1.00},{value:"Square", multiplier:1.00},{value:"Round", multiplier:1.10},{value:"Custom Cut", multiplier:1.40}],
        Thickness: [{value:"Standard 20mil", multiplier:1.00},{value:"Premium 30mil", multiplier:1.30}],
        Quantity: [{value:"50"},{value:"100"},{value:"250"},{value:"500"},{value:"1000"}]
      }}]},
};

const ORIGINALS = JSON.parse(JSON.stringify(BLUEPRINTS));

// Per-product UI mode: 'forward' (edit setup/per-unit) or 'inverse' (edit anchor qty/price/absorption)
const MODES = {};

// Derive setup + per_unit from anchor qty, anchor price, absorption qty, margin
function deriveFromAnchor(anchorQty, anchorPrice, absorptionQty, margin) {
  const cost = anchorPrice / (1 + margin);
  const denom = (absorptionQty + anchorQty) || 1;
  const perUnit = cost / denom;
  const setup = absorptionQty * perUnit;
  return {
    base_setup_cost: Math.round(setup * 100) / 100,
    base_per_unit_cost: Math.round(perUnit * 10000) / 10000
  };
}

// =============================================================
// PRICING + EXPANSION
// =============================================================
function extractQty(value) {
  const m = String(value).match(/\d+/);
  return m ? parseInt(m[0]) : 1;
}
function computePriceV1(values) {
  let base = 0, mult = 1;
  for (const v of values) {
    if (v.base_price !== undefined) base += +v.base_price;
    if (v.per_unit_price !== undefined) base += +v.per_unit_price * extractQty(v.value);
    if (v.multiplier !== undefined) mult *= +v.multiplier;
  }
  return Math.round(base * mult * 100) / 100;
}
function computePriceV2(product, attrNames, combo) {
  const p = product.pricing;
  const baseSetup = +p.base_setup_cost || 0;
  const basePerUnit = +p.base_per_unit_cost || 0;
  const margin = +p.margin_pct || 0;
  let qty = 1, mult = 1, setupAddon = 0;
  for (let i = 0; i < attrNames.length; i++) {
    const v = combo[i];
    if (attrNames[i].toLowerCase() === "quantity") {
      if (v.price_override !== undefined) return Math.round(+v.price_override * 100) / 100;
      qty = extractQty(v.value);
    }
    if (v.multiplier !== undefined) mult *= +v.multiplier;
    if (v.setup_addon !== undefined) setupAddon += +v.setup_addon;
  }
  const perUnit = basePerUnit * mult;
  const setup = baseSetup + setupAddon;
  const cost = setup + (perUnit * qty);
  return Math.round(cost * (1 + margin) * 100) / 100;
}
function computePrice(product, attrNames, combo) {
  if (product && product.pricing) return computePriceV2(product, attrNames, combo);
  return computePriceV1(combo);
}
function slug(s) { return String(s).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6) || "X"; }
function cartesian(arr) {
  return arr.reduce((acc, curr) => acc.flatMap(a => curr.map(c => [...a, c])), [[]]);
}
function expandProduct(product) {
  const names = Object.keys(product.attributes);
  const lists = names.map(n => product.attributes[n]);
  return cartesian(lists).map(combo => ({
    sku: [product.sku_prefix, ...combo.map(v => slug(v.value))].join("-"),
    attrs: Object.fromEntries(names.map((n, i) => [n, combo[i].value])),
    price: computePrice(product, names, combo),
  }));
}
function totalVariants() {
  let n = 0;
  for (const slug in BLUEPRINTS) for (const p of BLUEPRINTS[slug].products) n += expandProduct(p).length;
  return n;
}
function categoryVariantCount(slug) {
  let n = 0;
  for (const p of BLUEPRINTS[slug].products) n += expandProduct(p).length;
  return n;
}

// =============================================================
// RENDER
// =============================================================
let activeCategory = "business-cards";

function renderPricingPanel(catSlug, pidx) {
  const product = BLUEPRINTS[catSlug].products[pidx];
  if (!product.pricing) return '';
  const orig = ORIGINALS[catSlug].products[pidx].pricing;
  const modeKey = `${catSlug}/${pidx}`;
  const mode = MODES[modeKey] || 'forward';

  const setupVal = +product.pricing.base_setup_cost || 0;
  const perUnitVal = +product.pricing.base_per_unit_cost || 0;
  const marginVal = +product.pricing.margin_pct || 0;
  const absorptionQty = perUnitVal > 0 ? Math.round(setupVal / perUnitVal) : 0;

  const qtyAttr = product.attributes.Quantity || product.attributes.quantity || [];
  const qtys = qtyAttr.map(q => extractQty(q.value)).filter(n => n > 0);
  const maxQty = qtys.length ? Math.max(...qtys) : 1000;
  const minQ = qtys.length ? Math.min(...qtys) : 1, maxQ = maxQty;
  const anchorPrice = Math.round((setupVal + perUnitVal * maxQty) * (1 + marginVal) * 100) / 100;

  const setupMod = setupVal !== orig.base_setup_cost ? "modified" : "";
  const perUnitMod = perUnitVal !== orig.base_per_unit_cost ? "modified" : "";
  const marginMod = marginVal !== orig.margin_pct ? "modified" : "";

  const fullyAbsorbed = absorptionQty * 4;
  const pos = Math.max(0, Math.min(100, Math.round(100 * (Math.log(absorptionQty || 1) - Math.log(minQ || 1)) / (Math.log(maxQ || 1) - Math.log(minQ || 1) || 1))));

  const forwardFields = `
    <div class="pricing-fields">
      <div class="pricing-field">
        <label>Base Setup Cost</label>
        <div class="input-wrap">
          <span>$</span>
          <input type="number" step="0.01" data-cat="${catSlug}" data-pidx="${pidx}" data-pricing-field="base_setup_cost" value="${setupVal}" class="${setupMod}">
        </div>
        <div class="hint">Plates, prepress, dies. Paid once per order.</div>
      </div>
      <div class="pricing-field">
        <label>Per-Unit Cost (baseline)</label>
        <div class="input-wrap">
          <span>$</span>
          <input type="number" step="0.001" data-cat="${catSlug}" data-pidx="${pidx}" data-pricing-field="base_per_unit_cost" value="${perUnitVal}" class="${perUnitMod}">
        </div>
        <div class="hint">Paper + ink + labor at cheapest material/finish.</div>
      </div>
      <div class="pricing-field">
        <label>Margin (markup × cost)</label>
        <div class="input-wrap">
          <input type="number" step="0.05" data-cat="${catSlug}" data-pidx="${pidx}" data-pricing-field="margin_pct" value="${marginVal}" class="${marginMod}">
          <span>×</span>
        </div>
        <div class="hint">1.00 = 50% gross · 0.50 = 33% · 0.67 = 40%</div>
      </div>
    </div>
  `;

  const inverseFields = `
    <div class="pricing-fields" style="grid-template-columns: repeat(4, 1fr);">
      <div class="pricing-field">
        <label>Anchor Quantity</label>
        <div class="input-wrap">
          <input type="number" step="1" data-inverse-cat="${catSlug}" data-inverse-pidx="${pidx}" data-inverse-field="anchor_qty" value="${maxQty}">
          <span>qty</span>
        </div>
        <div class="hint">The qty where you pin a target retail price.</div>
      </div>
      <div class="pricing-field">
        <label>Target Retail Price</label>
        <div class="input-wrap">
          <span>$</span>
          <input type="number" step="0.01" data-inverse-cat="${catSlug}" data-inverse-pidx="${pidx}" data-inverse-field="anchor_price" value="${anchorPrice.toFixed(2)}">
        </div>
        <div class="hint">What customers pay at that anchor qty (baseline config).</div>
      </div>
      <div class="pricing-field">
        <label>Absorption Quantity</label>
        <div class="input-wrap">
          <input type="number" step="1" data-inverse-cat="${catSlug}" data-inverse-pidx="${pidx}" data-inverse-field="absorption_qty" value="${absorptionQty}">
          <span>qty</span>
        </div>
        <div class="hint">Where setup-per-piece equals per-unit cost.</div>
      </div>
      <div class="pricing-field">
        <label>Margin (markup × cost)</label>
        <div class="input-wrap">
          <input type="number" step="0.05" data-inverse-cat="${catSlug}" data-inverse-pidx="${pidx}" data-inverse-field="margin_pct" value="${marginVal}">
          <span>×</span>
        </div>
        <div class="hint">1.00 = 50% gross · 0.50 = 33%</div>
      </div>
    </div>
    <div class="derived-strip">
      <span><span class="lbl">Derived setup</span><span class="v">$${setupVal.toFixed(2)}</span></span>
      <span><span class="lbl">Derived per-unit</span><span class="v">$${perUnitVal.toFixed(4)}</span></span>
      <span style="font-size:11px;color:#a16207;font-style:italic;flex:1;text-align:right">Edit any anchor field — setup and per-unit recalculate.</span>
    </div>
  `;

  return `
    <h4>
      <span>Product Pricing
        <span class="mode-toggle" style="margin-left:12px">
          <button class="${mode==='forward'?'active':''}" onclick="setMode('${catSlug}', ${pidx}, 'forward')">Forward</button>
          <button class="${mode==='inverse'?'active':''}" onclick="setMode('${catSlug}', ${pidx}, 'inverse')">Anchor</button>
        </span>
      </span>
      <span class="formula">price = (setup + per_unit × qty) × (1 + margin)</span>
    </h4>
    ${mode === 'forward' ? forwardFields : inverseFields}
    <div class="absorption-strip" id="absorption-${pidx}">
      <div>
        <div class="label">Setup absorbs at qty ≈</div>
        <div class="value">${absorptionQty.toLocaleString()}</div>
      </div>
      <div class="explain">
        Below <b>${absorptionQty.toLocaleString()}</b>, customers pay disproportionately for setup.
        Around <b>${absorptionQty.toLocaleString()}</b>, setup-per-piece equals per-unit cost.
        Above <b>${fullyAbsorbed.toLocaleString()}</b>, setup is mostly invisible — prices flatten toward materials.
      </div>
      <div style="flex:0 0 220px">
        <div class="absorption-bar" style="background: linear-gradient(to right, #fed7aa 0%, #fed7aa ${pos}%, #d1fae5 ${pos}%, #d1fae5 100%);">
          <div class="marker" style="left: ${pos}%"></div>
        </div>
        <div class="absorption-bar-labels"><span>qty ${minQ.toLocaleString()}</span><span>setup-heavy ← | → material-heavy</span><span>qty ${maxQ.toLocaleString()}</span></div>
      </div>
    </div>
  `;
}

function setMode(catSlug, pidx, mode) {
  MODES[`${catSlug}/${pidx}`] = mode;
  const panel = document.querySelector(`[data-product-pricing-panel="${catSlug}/${pidx}"]`);
  if (panel) {
    panel.innerHTML = renderPricingPanel(catSlug, pidx);
    wireUpPricingInputs(panel, catSlug, pidx);
  }
}

function wireUpPricingInputs(panel, catSlug, pidx) {
  panel.querySelectorAll("input[data-pricing-field]").forEach(input => {
    input.addEventListener("input", e => {
      const field = e.target.dataset.pricingField;
      const val = parseFloat(e.target.value);
      if (!isNaN(val)) {
        BLUEPRINTS[catSlug].products[pidx].pricing[field] = val;
        rerenderProduct(catSlug, pidx);
      }
    });
  });
  panel.querySelectorAll("input[data-inverse-field]").forEach(input => {
    input.addEventListener("input", e => {
      const product = BLUEPRINTS[catSlug].products[pidx];
      const inputs = panel.querySelectorAll("input[data-inverse-field]");
      const vals = {};
      inputs.forEach(inp => { vals[inp.dataset.inverseField] = parseFloat(inp.value); });
      if ([vals.anchor_qty, vals.anchor_price, vals.absorption_qty, vals.margin_pct].some(v => isNaN(v) || v < 0)) return;
      const derived = deriveFromAnchor(vals.anchor_qty, vals.anchor_price, vals.absorption_qty, vals.margin_pct);
      product.pricing.base_setup_cost = derived.base_setup_cost;
      product.pricing.base_per_unit_cost = derived.base_per_unit_cost;
      product.pricing.margin_pct = vals.margin_pct;
      // Update derived strip in place without full re-render to preserve focus
      const derivedStrip = panel.querySelector(".derived-strip");
      if (derivedStrip) {
        const vs = derivedStrip.querySelectorAll(".v");
        if (vs[0]) vs[0].textContent = `$${derived.base_setup_cost.toFixed(2)}`;
        if (vs[1]) vs[1].textContent = `$${derived.base_per_unit_cost.toFixed(4)}`;
      }
      rerenderProduct(catSlug, pidx, /*skipPanel*/true);
    });
  });
}

function renderSidebar() {
  const list = document.getElementById("cat-list");
  list.innerHTML = "";
  for (const slug in BLUEPRINTS) {
    const cat = BLUEPRINTS[slug];
    const isTuned = cat.products.some(p => p.pricing);
    const div = document.createElement("div");
    div.className = "cat" + (slug === activeCategory ? " active" : "");
    div.innerHTML = `<span>${cat.name}${isTuned ? '<span class="cat-tag tuned">TUNED</span>' : ''}</span><span class="count">${categoryVariantCount(slug).toLocaleString()}</span>`;
    div.onclick = () => { activeCategory = slug; renderAll(); };
    list.appendChild(div);
  }
}

function renderHeader() {
  document.getElementById("stat-variants").textContent = totalVariants().toLocaleString();
}

function renderContent() {
  const cat = BLUEPRINTS[activeCategory];
  const c = document.getElementById("content");
  c.innerHTML = "";

  if (activeCategory === "business-cards" && !window.__demoSeen) {
    const intro = document.createElement("div");
    intro.className = "demo-tip";
    intro.innerHTML = `<span>👋</span><span><strong>Try it:</strong> Change "Base Setup Cost" from <code>15.00</code> to <code>25.00</code> in the yellow Pricing panel below. Watch <em>every variant</em> reprice — but the discount curve stays correct because setup absorbs at scale.</span>`;
    c.appendChild(intro);
  }

  for (let pi = 0; pi < cat.products.length; pi++) {
    const product = cat.products[pi];
    const variants = expandProduct(product);

    const productDiv = document.createElement("div");
    productDiv.className = "product";

    const headerDiv = document.createElement("div");
    headerDiv.className = "product-header";
    headerDiv.innerHTML = `
      <div>
        <h3>${product.name}</h3>
        <div class="desc">${product.description}</div>
      </div>
      <div class="variant-badge">${variants.length.toLocaleString()} variants</div>
    `;
    productDiv.appendChild(headerDiv);

    // ---- Pricing panel for v2 products (with mode toggle) ----
    if (product.pricing) {
      const pricingDiv = document.createElement("div");
      pricingDiv.className = "pricing-panel";
      pricingDiv.setAttribute("data-product-pricing-panel", `${activeCategory}/${pi}`);
      pricingDiv.innerHTML = renderPricingPanel(activeCategory, pi);
      productDiv.appendChild(pricingDiv);
    } else {
      const banner = document.createElement("div");
      banner.style.padding = "12px 24px";
      banner.style.background = "#f3f4f6";
      banner.style.borderBottom = "1px solid #e5e7eb";
      banner.style.fontSize = "11px";
      banner.style.color = "#6b7280";
      banner.style.fontStyle = "italic";
      banner.innerHTML = `Using legacy multiplier model — quantity tiers carry literal prices. (Tune to cost-based when ready.)`;
      productDiv.appendChild(banner);
    }

    // ---- Attribute editors ----
    const attrsDiv = document.createElement("div");
    attrsDiv.className = "attributes";
    const attrNames = Object.keys(product.attributes);
    for (const aname of attrNames) {
      const ag = document.createElement("div");
      ag.className = "attribute";
      const isQty = aname.toLowerCase() === "quantity";
      const isFinish = aname.toLowerCase() === "finish" && product.pricing;
      let subhead = "MULTIPLIER";
      if (isQty) subhead = product.pricing ? "QTY" : "DOLLARS";
      if (isFinish) subhead = "MULT × · SETUP $+";
      ag.innerHTML = `<h4>${aname}<span style="float:right;font-weight:normal;color:#aaa">${subhead}</span></h4>`;

      product.attributes[aname].forEach((opt, idx) => {
        const row = document.createElement("div");
        row.className = "attr-row";
        const orig = ORIGINALS[activeCategory].products[pi].attributes[aname][idx];

        let inputHtml = "";
        const dataAttrs = `data-cat="${activeCategory}" data-pidx="${pi}" data-attr="${aname}" data-idx="${idx}"`;

        if (opt.base_price !== undefined) {
          const m = opt.base_price !== orig.base_price ? "modified" : "";
          inputHtml = `<input type="number" step="0.01" ${dataAttrs} data-field="base_price" value="${opt.base_price}" class="${m}"><span class="unit">$</span>`;
        } else if (opt.per_unit_price !== undefined) {
          const m = opt.per_unit_price !== orig.per_unit_price ? "modified" : "";
          inputHtml = `<input type="number" step="0.01" ${dataAttrs} data-field="per_unit_price" value="${opt.per_unit_price}" class="${m}"><span class="unit">$/ea</span>`;
        } else if (opt.multiplier !== undefined && opt.setup_addon !== undefined) {
          const mMod = opt.multiplier !== orig.multiplier ? "modified" : "";
          const sMod = opt.setup_addon !== orig.setup_addon ? "modified" : "";
          const dollarBlock = product.pricing
            ? `<div class="dollar-edit-wrap"><span class="lbl">per-piece $</span><span class="prefix">$</span><input type="number" step="0.0001" min="0" ${dataAttrs} data-field="dollar_cost" value="${(product.pricing.base_per_unit_cost * opt.multiplier).toFixed(4)}" class="dollar-input ${mMod}" title="Per-piece material cost (edits the multiplier)"><span class="suffix">/unit</span></div>`
            : "";
          inputHtml =
            `<input type="number" step="0.01" ${dataAttrs} data-field="multiplier" value="${opt.multiplier}" class="${mMod}" title="Per-unit cost multiplier"><span class="unit">×</span>` +
            `<input type="number" step="1" ${dataAttrs} data-field="setup_addon" value="${opt.setup_addon}" class="${sMod}" title="Extra setup cost (plate/die)" style="margin-left:6px"><span class="unit">$+</span>` +
            dollarBlock;
        } else if (opt.multiplier !== undefined) {
          const m = opt.multiplier !== orig.multiplier ? "modified" : "";
          const dollarBlock = product.pricing
            ? `<div class="dollar-edit-wrap"><span class="lbl">per-piece $</span><span class="prefix">$</span><input type="number" step="0.0001" min="0" ${dataAttrs} data-field="dollar_cost" value="${(product.pricing.base_per_unit_cost * opt.multiplier).toFixed(4)}" class="dollar-input ${m}" title="Per-piece material cost (edits the multiplier)"><span class="suffix">/unit</span></div>`
            : "";
          inputHtml = `<input type="number" step="0.01" ${dataAttrs} data-field="multiplier" value="${opt.multiplier}" class="${m}"><span class="unit">×</span>${dollarBlock}`;
        } else {
          inputHtml = `<span class="derived">derived from formula</span>`;
        }

        row.innerHTML = `<span class="name">${opt.value}</span><span class="inputs">${inputHtml}</span>`;
        ag.appendChild(row);
      });
      attrsDiv.appendChild(ag);
    }
    productDiv.appendChild(attrsDiv);

    // ---- Variants section ----
    const variantsSection = document.createElement("div");
    variantsSection.className = "variants-section";
    variantsSection.innerHTML = `
      <h4>
        <span>Generated Variants <span class="reset-link" onclick="resetCategory()">↺ reset to defaults</span></span>
        <button class="download-btn" onclick="downloadCSV('${activeCategory}', ${pi})">↓ Download CSV</button>
      </h4>
      <div class="filter-row">
        <input type="text" placeholder="Filter variants (e.g., 'Glossy Foil 1000')..." oninput="filterVariants(this.value, ${pi})" id="variant-filter-${pi}">
      </div>
      <div class="variants-table" id="variants-table-wrap-${pi}"></div>
    `;
    productDiv.appendChild(variantsSection);

    c.appendChild(productDiv);
    renderVariantsTable(variants, attrNames, "", false, pi);
  }

  // Wire up event listeners — pricing panels (both forward and inverse modes) get
  // their handlers via wireUpPricingInputs per panel, attribute inputs at top level.
  c.querySelectorAll("[data-product-pricing-panel]").forEach(panel => {
    const [cat, pidx] = panel.dataset.productPricingPanel.split('/');
    wireUpPricingInputs(panel, cat, +pidx);
  });
  c.querySelectorAll("input[data-field]").forEach(input => {
    input.addEventListener("input", e => {
      const cat = e.target.dataset.cat;
      const pidx = +e.target.dataset.pidx;
      const aname = e.target.dataset.attr;
      const idx = +e.target.dataset.idx;
      const field = e.target.dataset.field;
      const val = parseFloat(e.target.value);
      if (isNaN(val)) return;
      const product = BLUEPRINTS[cat].products[pidx];
      const opt = product.attributes[aname][idx];
      const origOpt = ORIGINALS[cat].products[pidx].attributes[aname][idx];

      if (field === "dollar_cost") {
        // Edited the per-piece dollar value directly — back-compute the multiplier.
        const base = +(product.pricing && product.pricing.base_per_unit_cost) || 0;
        const newMult = base > 0 ? Math.round((val / base) * 10000) / 10000 : 1;
        opt.multiplier = newMult;
        const row = e.target.closest(".attr-row");
        const multInput = row && row.querySelector('input[data-field="multiplier"]');
        if (multInput) {
          multInput.value = newMult;
          if (newMult !== origOpt.multiplier) multInput.classList.add("modified");
          else multInput.classList.remove("modified");
        }
        const baselineDollar = base * (origOpt.multiplier || 1);
        if (Math.abs(val - baselineDollar) > 1e-6) e.target.classList.add("modified");
        else e.target.classList.remove("modified");
      } else {
        opt[field] = val;
        if (val !== origOpt[field]) e.target.classList.add("modified");
        else e.target.classList.remove("modified");
      }
      rerenderProduct(cat, pidx);
    });
  });

  window.__demoSeen = true;
}

function rerenderProduct(catSlug, pidx, skipPanel) {
  const product = BLUEPRINTS[catSlug].products[pidx];
  const variants = expandProduct(product);
  const filterVal = document.getElementById(`variant-filter-${pidx}`)?.value || "";
  renderVariantsTable(variants, Object.keys(product.attributes), filterVal, true, pidx);
  renderHeader();
  document.querySelectorAll("#cat-list .cat").forEach((el, i) => {
    const slug = Object.keys(BLUEPRINTS)[i];
    el.querySelector(".count").textContent = categoryVariantCount(slug).toLocaleString();
  });
  const badges = document.querySelectorAll(".variant-badge");
  if (badges[pidx]) badges[pidx].textContent = variants.length.toLocaleString() + " variants";

  // Refresh absorption strip + dollar inputs so they reflect the current state
  if (product.pricing) {
    const setup = +product.pricing.base_setup_cost || 0;
    const perUnit = +product.pricing.base_per_unit_cost || 0;
    if (perUnit > 0) {
      const crossover = Math.round(setup / perUnit);
      const fullyAbsorbed = crossover * 4;
      const qtyAttr = product.attributes.Quantity || product.attributes.quantity || [];
      const qtys = qtyAttr.map(q => extractQty(q.value)).filter(n => n > 0);
      const minQ = qtys.length ? Math.min(...qtys) : 1, maxQ = qtys.length ? Math.max(...qtys) : 1;
      const pos = Math.max(0, Math.min(100, Math.round(100 * (Math.log(crossover || 1) - Math.log(minQ || 1)) / (Math.log(maxQ || 1) - Math.log(minQ || 1) || 1))));
      const strip = document.getElementById(`absorption-${pidx}`);
      if (strip) {
        strip.querySelector(".value").textContent = crossover.toLocaleString();
        strip.querySelector(".explain").innerHTML =
          `Below <b>${crossover.toLocaleString()}</b>, customers pay disproportionately for setup. ` +
          `Around <b>${crossover.toLocaleString()}</b>, setup-per-piece equals per-unit cost. ` +
          `Above <b>${fullyAbsorbed.toLocaleString()}</b>, setup is mostly invisible — prices flatten toward materials.`;
        const bar = strip.querySelector(".absorption-bar");
        bar.style.background = `linear-gradient(to right, #fed7aa 0%, #fed7aa ${pos}%, #d1fae5 ${pos}%, #d1fae5 100%)`;
        bar.querySelector(".marker").style.left = pos + "%";
      }
    }
    // Refresh dollar-cost inputs (skip the one currently being edited)
    document.querySelectorAll(`.attr-row .dollar-input`).forEach(dollarInput => {
      if (dollarInput.dataset.cat !== catSlug || +dollarInput.dataset.pidx !== pidx) return;
      if (document.activeElement === dollarInput) return;
      const row = dollarInput.closest('.attr-row');
      const multInput = row && row.querySelector('input[data-field="multiplier"]');
      const mult = multInput ? (parseFloat(multInput.value) || 1) : 1;
      dollarInput.value = (perUnit * mult).toFixed(4);
    });
  }
}

function renderVariantsTable(variants, attrNames, filter, animate, pidx) {
  const wrap = document.getElementById(`variants-table-wrap-${pidx}`);
  if (!wrap) return;
  const filtered = filter
    ? variants.filter(v => v.sku.toLowerCase().includes(filter.toLowerCase()) ||
        Object.values(v.attrs).join(" ").toLowerCase().includes(filter.toLowerCase()))
    : variants;
  const limit = 200;
  const shown = filtered.slice(0, limit);
  let html = `<table>
    <thead><tr>
      <th>SKU</th>
      ${attrNames.map(n => `<th>${n}</th>`).join("")}
      <th style="text-align:right">Price</th>
    </tr></thead><tbody>`;
  for (const v of shown) {
    html += `<tr>
      <td class="sku">${v.sku}</td>
      ${attrNames.map(n => `<td>${v.attrs[n]}</td>`).join("")}
      <td class="price ${animate ? "changed" : ""}">$${v.price.toFixed(2)}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  if (filtered.length > limit) {
    html += `<div style="padding:12px;text-align:center;color:#999;font-size:11px;background:#fafafa">
      Showing ${limit} of ${filtered.length.toLocaleString()} matching variants. Use filter to narrow.
    </div>`;
  }
  wrap.innerHTML = html;
}

function filterVariants(value, pidx) {
  const cat = BLUEPRINTS[activeCategory];
  const product = cat.products[pidx];
  const variants = expandProduct(product);
  renderVariantsTable(variants, Object.keys(product.attributes), value, false, pidx);
}

function resetCategory() {
  BLUEPRINTS[activeCategory] = JSON.parse(JSON.stringify(ORIGINALS[activeCategory]));
  renderAll();
}

function downloadCSV(catSlug, pidx) {
  const cat = BLUEPRINTS[catSlug];
  const product = cat.products[pidx];
  const variants = expandProduct(product);
  const attrNames = Object.keys(product.attributes);
  const headers = ["SKU", "Product", ...attrNames, "Price"];
  let csv = headers.map(h => `"${h}"`).join(",") + "\n";
  for (const v of variants) {
    const row = [v.sku, product.name, ...attrNames.map(n => v.attrs[n]), v.price.toFixed(2)];
    csv += row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",") + "\n";
  }
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${catSlug}_variants.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderAll() {
  renderSidebar();
  renderContent();
  renderHeader();
}

renderAll();
</script>
